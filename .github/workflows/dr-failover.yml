name: Kafka DR Failover

on:
  workflow_dispatch:

jobs:
  failover:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Azure Login
      run: |
        az login --service-principal           -u ${{ secrets.AZURE_CLIENT_ID }}           -p ${{ secrets.AZURE_CLIENT_SECRET }}           --tenant ${{ secrets.AZURE_TENANT_ID }}

    - name: Get AKS Credentials
      run: |
        az aks get-credentials           --resource-group rg-kafka           --name aks-kafka-prod

    - name: Build DR Automation Image
      run: |
        docker build -t kafka-dr-tools:latest .

    - name: Push Image
      run: |
        docker tag kafka-dr-tools:latest myacr.azurecr.io/kafka-dr-tools:latest
        docker push myacr.azurecr.io/kafka-dr-tools:latest

    - name: Deploy DR Job
      run: |
        kubectl apply -f k8s/dr-job.yaml

    - name: Wait For Job Completion
      run: |
        kubectl wait           --for=condition=complete           job/kafka-dr-failover           -n kafka-dr           --timeout=600s

    - name: Fetch Logs
      run: |
        kubectl logs job/kafka-dr-failover -n kafka-dr
